<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十三分鐘略懂 AI 技術 - 簡報投影片線上檢視器 | iPAS 筆記整理</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .active-tab {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 14px 0 rgba(234, 88, 12, 0.39);
    }
    .thumb-active {
      border-color: #f97316 !important;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden selection:bg-orange-500 selection:text-white">

  <!-- Top App Navigation Bar -->
  <header class="h-16 flex-none bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 flex items-center justify-between z-30">
    <!-- Left: Branding & Back Button -->
    <div class="flex items-center gap-3">
      <a href="../index.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-semibold transition border border-slate-700/60" title="返回首頁">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="hidden sm:inline">返回目錄</span>
      </a>
      <div class="h-5 w-px bg-slate-800 hidden sm:block"></div>
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-orange-500 to-amber-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
          <i class="fa-solid fa-file-powerpoint text-sm"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-semibold px-1.5 py-0.5 rounded bg-orange-500/10 text-orange-400 border border-orange-500/20">iPAS 專案簡報</span>
            <h1 class="text-sm font-bold text-white tracking-tight hidden md:inline">十三分鐘略懂 AI 技術</h1>
          </div>
          <p class="text-[11px] text-slate-400 leading-tight hidden lg:block" id="currentPresentationTitle">
            第 01 輯：核心原理與歷史 (15 頁)
          </p>
        </div>
      </div>
    </div>

    <!-- Center: Presentation Selector Tabs -->
    <div class="flex items-center bg-slate-950/80 p-1 rounded-xl border border-slate-800 max-w-xl">
      <button onclick="switchPresentation(1)" id="tab-btn-1" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5 active-tab">
        <i class="fa-solid fa-1 text-[11px]"></i>
        <span>簡報一 <span class="text-[10px] opacity-75 hidden sm:inline">(15P)</span></span>
      </button>
      <button onclick="switchPresentation(2)" id="tab-btn-2" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5">
        <i class="fa-solid fa-2 text-[11px]"></i>
        <span>簡報二 <span class="text-[10px] opacity-75 hidden sm:inline">(15P)</span></span>
      </button>
      <button onclick="switchPresentation(3)" id="tab-btn-3" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5">
        <i class="fa-solid fa-3 text-[11px]"></i>
        <span>簡報三 <span class="text-[10px] opacity-75 hidden sm:inline">(13P)</span></span>
      </button>
    </div>

    <!-- Right: Mode Switches & Action Buttons -->
    <div class="flex items-center gap-2">
      <!-- Mode Toggle: Slide Mode vs Native Iframe Mode -->
      <div class="hidden md:flex items-center bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-xs">
        <button onclick="setViewMode('slide')" id="mode-slide-btn" class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 text-orange-400 transition flex items-center gap-1" title="投影片翻頁模式">
          <i class="fa-solid fa-tv"></i>
          <span>幻燈片</span>
        </button>
        <button onclick="setViewMode('native')" id="mode-native-btn" class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition flex items-center gap-1" title="原生 PDF 閱讀模式">
          <i class="fa-solid fa-file-lines"></i>
          <span>原生檢視</span>
        </button>
      </div>

      <!-- Action Buttons -->
      <a id="btnOpenNewTab" href="#" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition border border-slate-700/60 hidden sm:flex items-center gap-1.5" title="以原生分頁開啟 PDF">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        <span class="hidden xl:inline">獨立分頁</span>
      </a>
      <a id="btnDownload" href="#" download class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition border border-slate-700/60 flex items-center gap-1.5" title="下載 PDF 簡報">
        <i class="fa-solid fa-download"></i>
        <span class="hidden sm:inline">下載</span>
      </a>
      <button onclick="toggleFullScreen()" class="px-2.5 py-1.5 rounded-lg bg-orange-600 hover:bg-orange-500 text-white text-xs font-medium transition shadow-sm shadow-orange-600/30 flex items-center gap-1.5" title="全螢幕播放 (按 F 鍵)">
        <i class="fa-solid fa-expand"></i>
        <span class="hidden sm:inline">全螢幕</span>
      </button>
    </div>
  </header>

  <!-- Main Presentation Area -->
  <main class="flex-1 relative flex overflow-hidden bg-slate-950">

    <!-- View Mode 1: Slide Presentation View (Canvas with PDF.js) -->
    <div id="slideViewContainer" class="flex-1 flex flex-col relative w-full h-full">

      <!-- Slide Canvas Container -->
      <div id="slideStage" class="flex-1 relative flex items-center justify-center p-2 sm:p-4 overflow-hidden bg-radial from-slate-900 to-slate-950">
        
        <!-- Loading Spinner -->
        <div id="loadingOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 z-20 backdrop-blur-sm transition-opacity duration-300">
          <div class="w-12 h-12 border-4 border-orange-500/30 border-t-orange-500 rounded-full animate-spin mb-4"></div>
          <p class="text-sm font-medium text-slate-300">正在加載簡報高畫質投影片...</p>
          <span class="text-xs text-slate-500 mt-1">首次渲染解析度 1376×768 向量圖形</span>
        </div>

        <!-- Canvas for Current Slide -->
        <div class="relative max-w-full max-h-full flex items-center justify-center shadow-2xl rounded-lg overflow-hidden border border-slate-800/80 bg-black">
          <canvas id="pdfCanvas" class="block max-w-full max-h-[calc(100vh-140px)] object-contain transition-transform duration-200"></canvas>
        </div>

        <!-- Left / Right Nav Overlay Buttons (Hover to show on desktop) -->
        <button onclick="prevSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-slate-900/70 hover:bg-orange-600 text-white/80 hover:text-white backdrop-blur flex items-center justify-center border border-slate-700/50 transition-all hover:scale-110 shadow-xl group z-10" title="上一頁 (← 鍵)">
          <i class="fa-solid fa-chevron-left text-lg group-hover:-translate-x-0.5 transition-transform"></i>
        </button>
        <button onclick="nextSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-slate-900/70 hover:bg-orange-600 text-white/80 hover:text-white backdrop-blur flex items-center justify-center border border-slate-700/50 transition-all hover:scale-110 shadow-xl group z-10" title="下一頁 (→ 鍵或 Space)">
          <i class="fa-solid fa-chevron-right text-lg group-hover:translate-x-0.5 transition-transform"></i>
        </button>
      </div>

      <!-- Slide Bottom Control Bar -->
      <div class="h-14 flex-none bg-slate-900/90 backdrop-blur border-t border-slate-800 px-4 flex items-center justify-between z-20">
        <!-- Slide Progress -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 text-xs font-semibold bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
            <span class="text-orange-400" id="pageNumDisplay">1</span>
            <span class="text-slate-600">/</span>
            <span class="text-slate-400" id="pageTotalDisplay">15</span>
          </div>
          <div class="hidden sm:flex items-center gap-1 text-[11px] text-slate-500">
            <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">←</kbd>
            <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">→</kbd>
            <span>翻頁</span>
            <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400 ml-1">F</kbd>
            <span>全螢幕</span>
          </div>
        </div>

        <!-- Pagination Controls -->
        <div class="flex items-center gap-2">
          <button onclick="prevSlide()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition flex items-center gap-1.5 border border-slate-700/50">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="hidden sm:inline">上一頁</span>
          </button>
          <button onclick="nextSlide()" class="px-4 py-1.5 rounded-lg bg-orange-600 hover:bg-orange-500 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-sm shadow-orange-600/30">
            <span>下一頁</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- Thumbnails Drawer Trigger -->
        <div class="flex items-center gap-2">
          <button onclick="toggleThumbnails()" id="thumbToggleBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition flex items-center gap-1.5 border border-slate-700/50" title="展開縮圖預覽列">
            <i class="fa-solid fa-table-cells"></i>
            <span class="hidden sm:inline">頁面縮圖</span>
          </button>
        </div>
      </div>

      <!-- Slide Thumbnails Drawer (Collapsible) -->
      <div id="thumbDrawer" class="h-28 flex-none bg-slate-950 border-t border-slate-800 px-4 py-2 overflow-x-auto flex items-center gap-3 transition-all duration-300">
        <!-- Thumbnails injected by JS -->
      </div>
    </div>

    <!-- View Mode 2: Native PDF Iframe View -->
    <div id="nativeViewContainer" class="hidden flex-1 w-full h-full relative bg-slate-950">
      <iframe id="pdfIframe" src="" class="w-full h-full border-0"></iframe>
      <!-- Fallback message if iframe fails on local security -->
      <div id="iframeFallback" class="hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-950/95 z-10">
        <div class="w-16 h-16 rounded-2xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-orange-400 text-2xl mb-4">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h3 class="text-lg font-bold text-white mb-2">瀏覽器安全性提示</h3>
        <p class="text-sm text-slate-400 max-w-md mb-6 leading-relaxed">
          若您的瀏覽器在本地模式下限制內嵌檢視 PDF，請切換至「幻燈片」模式，或點擊下方按鈕以獨立分頁直接瀏覽！
        </p>
        <div class="flex items-center gap-3">
          <button onclick="setViewMode('slide')" class="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white text-sm font-semibold transition">
            切換至幻燈片播放
          </button>
          <a id="btnFallbackOpen" href="#" target="_blank" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold transition border border-slate-700">
            以獨立視窗開啟
          </a>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Configuration for the 3 presentations
    const presentations = {
      1: {
        file: '簡報_十三分鐘略懂 AI 技術_01.pdf',
        title: '第 01 輯：核心原理與歷史',
        pages: 15
      },
      2: {
        file: '簡報_十三分鐘略懂 AI 技術_02.pdf',
        title: '第 02 輯：機器學習與深度學習',
        pages: 15
      },
      3: {
        file: '簡報_十三分鐘略懂 AI 技術_03.pdf',
        title: '第 03 輯：演算法與延伸應用',
        pages: 13
      }
    };

    // State Variables
    let currentPart = 1;
    let currentPage = 1;
    let pdfDoc = null;
    let isRendering = false;
    let pageRenderingQueue = null;
    let viewMode = 'slide'; // 'slide' or 'native'
    let isThumbDrawerOpen = true;

    // Set worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Initialize from URL Params (?part=1&page=1)
    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const partParam = parseInt(urlParams.get('part'), 10);
      const pageParam = parseInt(urlParams.get('page'), 10);
      const modeParam = urlParams.get('mode');

      if (partParam && presentations[partParam]) {
        currentPart = partParam;
      }
      if (pageParam && pageParam > 0) {
        currentPage = pageParam;
      }
      if (modeParam === 'native') {
        viewMode = 'native';
      }

      loadPresentation(currentPart, currentPage);
      setupKeyboardNavigation();
    }

    // Switch Presentation Tab
    function switchPresentation(partNum) {
      if (currentPart === partNum && pdfDoc) return;
      currentPart = partNum;
      currentPage = 1;
      
      // Update Tab Styles
      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`tab-btn-${i}`);
        if (i === partNum) {
          btn.classList.add('active-tab');
        } else {
          btn.classList.remove('active-tab');
        }
      }

      loadPresentation(currentPart, 1);
      updateUrl();
    }

    // Load PDF Document
    async function loadPresentation(partNum, startPage = 1) {
      const pres = presentations[partNum];
      document.getElementById('currentPresentationTitle').textContent = `${pres.title} (${pres.pages} 頁)`;
      document.getElementById('pageTotalDisplay').textContent = pres.pages;
      
      const pdfUrl = encodeURIComponent(pres.file);
      document.getElementById('btnOpenNewTab').href = pres.file;
      document.getElementById('btnDownload').href = pres.file;
      document.getElementById('btnDownload').setAttribute('download', pres.file);
      document.getElementById('btnFallbackOpen').href = pres.file;

      // Update Native Iframe
      const iframe = document.getElementById('pdfIframe');
      iframe.src = `${pres.file}#toolbar=1&navpanes=1&view=FitH`;

      if (viewMode === 'native') {
        return;
      }

      // Show Loading
      const loading = document.getElementById('loadingOverlay');
      loading.style.opacity = '1';
      loading.style.display = 'flex';

      try {
        if (!window.pdfjsLib) {
          throw new Error('PDF.js not loaded');
        }
        const loadingTask = pdfjsLib.getDocument(pres.file);
        pdfDoc = await loadingTask.promise;
        document.getElementById('pageTotalDisplay').textContent = pdfDoc.numPages;
        
        renderThumbnails();
        renderPage(startPage);
      } catch (err) {
        console.warn('PDF.js direct render warning (fallback to native viewer):', err);
        // Fallback smoothly to native iframe view
        setViewMode('native');
        loading.style.display = 'none';
      }
    }

    // Render Canvas Page with High-DPI support
    async function renderPage(num) {
      if (!pdfDoc) return;
      if (isRendering) {
        pageRenderingQueue = num;
        return;
      }
      isRendering = true;
      currentPage = num;

      document.getElementById('pageNumDisplay').textContent = num;
      updateThumbSelection(num);

      try {
        const page = await pdfDoc.getPage(num);
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        // Calculate scale to fit container while maintaining 16:9
        const container = document.getElementById('slideStage');
        const containerWidth = container.clientWidth - 48;
        const containerHeight = container.clientHeight - 48;

        const baseViewport = page.getViewport({ scale: 1 });
        const scaleX = containerWidth / baseViewport.width;
        const scaleY = containerHeight / baseViewport.height;
        const scale = Math.min(scaleX, scaleY, 2.0); // Limit max scale

        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: scale });

        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport,
          transform: [dpr, 0, 0, dpr, 0, 0]
        };

        await page.render(renderContext).promise;
      } catch (err) {
        console.error('Error rendering page:', err);
      } finally {
        isRendering = false;
        const loading = document.getElementById('loadingOverlay');
        loading.style.opacity = '0';
        setTimeout(() => { loading.style.display = 'none'; }, 200);

        if (pageRenderingQueue !== null) {
          const nextNum = pageRenderingQueue;
          pageRenderingQueue = null;
          renderPage(nextNum);
        }
      }

      updateUrl();
    }

    // Next / Prev Slide
    function nextSlide() {
      if (!pdfDoc) return;
      if (currentPage < pdfDoc.numPages) {
        renderPage(currentPage + 1);
      } else if (currentPart < 3) {
        // Automatically advance to next part if at the end
        switchPresentation(currentPart + 1);
      }
    }

    function prevSlide() {
      if (!pdfDoc) return;
      if (currentPage > 1) {
        renderPage(currentPage - 1);
      } else if (currentPart > 1) {
        // Go back to previous part last page
        const prevPart = currentPart - 1;
        switchPresentation(prevPart);
      }
    }

    // Render Thumbnails Drawer
    async function renderThumbnails() {
      const drawer = document.getElementById('thumbDrawer');
      drawer.innerHTML = '';
      if (!pdfDoc) return;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const item = document.createElement('button');
        item.id = `thumb-item-${i}`;
        item.className = `flex-none h-20 w-32 rounded-lg bg-slate-900 border border-slate-800 hover:border-orange-500/50 p-1 flex flex-col items-center justify-between transition cursor-pointer relative overflow-hidden group ${i === currentPage ? 'thumb-active' : ''}`;
        item.onclick = () => renderPage(i);

        item.innerHTML = `
          <div class="flex-1 w-full bg-slate-950 rounded flex items-center justify-center text-[10px] text-slate-500 font-mono">
            <span>P.${i}</span>
          </div>
          <span class="text-[10px] font-semibold text-slate-400 group-hover:text-orange-400 transition mt-1">第 ${i} 頁</span>
        `;
        drawer.appendChild(item);
      }
    }

    function updateThumbSelection(num) {
      for (let i = 1; i <= (pdfDoc ? pdfDoc.numPages : 15); i++) {
        const item = document.getElementById(`thumb-item-${i}`);
        if (item) {
          if (i === num) {
            item.classList.add('thumb-active');
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          } else {
            item.classList.remove('thumb-active');
          }
        }
      }
    }

    function toggleThumbnails() {
      const drawer = document.getElementById('thumbDrawer');
      const btn = document.getElementById('thumbToggleBtn');
      if (isThumbDrawerOpen) {
        drawer.style.display = 'none';
        btn.classList.remove('text-orange-400');
      } else {
        drawer.style.display = 'flex';
        btn.classList.add('text-orange-400');
      }
      isThumbDrawerOpen = !isThumbDrawerOpen;
      // Re-render current page to adjust scale
      setTimeout(() => { if (pdfDoc) renderPage(currentPage); }, 150);
    }

    // View Mode Switching
    function setViewMode(mode) {
      viewMode = mode;
      const slideContainer = document.getElementById('slideViewContainer');
      const nativeContainer = document.getElementById('nativeViewContainer');
      const slideBtn = document.getElementById('mode-slide-btn');
      const nativeBtn = document.getElementById('mode-native-btn');

      if (mode === 'slide') {
        slideContainer.classList.remove('hidden');
        nativeContainer.classList.add('hidden');
        slideBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 text-orange-400 transition flex items-center gap-1';
        nativeBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition flex items-center gap-1';
        if (pdfDoc) {
          renderPage(currentPage);
        } else {
          loadPresentation(currentPart, currentPage);
        }
      } else {
        slideContainer.classList.add('hidden');
        nativeContainer.classList.remove('hidden');
        nativeBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 text-orange-400 transition flex items-center gap-1';
        slideBtn.className = 'px-2.5 py-1 rounded-md text-xs font-medium text-slate-400 hover:text-white transition flex items-center gap-1';
        const iframe = document.getElementById('pdfIframe');
        iframe.src = `${presentations[currentPart].file}#toolbar=1&navpanes=1&view=FitH`;
      }
      updateUrl();
    }

    // FullScreen Toggle
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Fullscreen request failed: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Keyboard Shortcuts
    function setupKeyboardNavigation() {
      window.addEventListener('keydown', (e) => {
        // Ignore if user is in an input
        if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        } else if (e.key === '1') {
          switchPresentation(1);
        } else if (e.key === '2') {
          switchPresentation(2);
        } else if (e.key === '3') {
          switchPresentation(3);
        }
      });

      // Window resize handling
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          if (viewMode === 'slide' && pdfDoc) {
            renderPage(currentPage);
          }
        }, 200);
      });
    }

    function updateUrl() {
      const url = new URL(window.location.href);
      url.searchParams.set('part', currentPart);
      url.searchParams.set('page', currentPage);
      if (viewMode === 'native') {
        url.searchParams.set('mode', 'native');
      } else {
        url.searchParams.delete('mode');
      }
      window.history.replaceState({}, '', url);
    }

    // Run on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
