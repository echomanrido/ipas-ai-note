      border-radius: 9999px;

      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .control-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    /* SVG 節點樣式 */
    .mindmap-node {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mindmap-node:hover circle {
      stroke-width: 4px;
      stroke: #38bdf8;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
    }
    .mindmap-node:hover text {
      font-weight: 900;
      fill: #38bdf8;
    }

      stroke-width: 4px;
      stroke: #fbbf24;
      filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8));
    }

    .detail-drawer {

      top: 0;
      right: 0;

      max-width: 90vw;

      overflow-y: auto;

  <script>
    const NODES = [{"id": "root_code", "name": "AI 程式架構", "x": 750, "y": 480, "r": 32, "color": "#0f172a", "stroke": "#38bdf8", "textColor": "#ffffff", "category": "core", "badge": "Core Architecture", "desc": "涵蓋從傳統機器學習 (Scikit-Learn) 到深度神經網路 (PyTorch) 與現代生成式 AI (Diffusers / Transformers) 的程式實作骨幹與函式調用全景。", "functions": [{"call": "import sklearn", "purpose": "傳統統計機器學習、特徵工程與模型評估庫"}, {"call": "import torch; import torch.nn as nn", "purpose": "深度學習核心張量運算與神經網路模組"}, {"call": "from diffusers import StableDiffusionPipeline", "purpose": "前沿生成式擴散模型高效推論與管線調度"}, {"call": "from transformers import AutoModelForCausalLM", "purpose": "大語言模型 (LLM) 載入與自迴歸生成"}], "highlights": "AI 程式開發核心邏輯在於「資料流水線 (Dataset/DataLoader) $\\to$ 假設模型定義 (Model) $\\to$ 損失函數 (Criterion/Loss) $\\to$ 最佳化梯度更新 (Optimizer/Step) $\\to$ 評估驗證 (Metrics)」。傳統 ML 強調特徵工程與封閉/數值求解；現代 DL 則強調端到端張量運算與反向傳播鏈鎖律。", "codeSnippet": "# AI 現代開發核心依賴導入\nimport numpy as np\nimport pandas as pd\nfrom sklearn.model_selection import train_test_split\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\n\ndevice = torch.device('cuda' if torch.cuda.is_available() else 'cpu')\nprint(f'AI Computation Engine initialized on: {device}')", "url": "index.html"}, {"id": "ml_group", "name": "Scikit-Learn 機器學習", "x": 520, "y": 320, "r": 26, "color": "#16a34a", "stroke": "#86efac", "textColor": "#ffffff", "category": "sklearn", "badge": "Classical ML", "desc": "以統一且優雅的 fit() / predict() API 封裝統計學習模型，涵蓋回歸、分類、降維、分群與交叉驗證。", "functions": [{"call": "model.fit(X_train, y_train)", "purpose": "傳入特徵矩陣與目標向量，執行訓練學習參數"}, {"call": "y_pred = model.predict(X_test)", "purpose": "對測試資料執行推論輸出連續數值或類別標籤"}, {"call": "y_prob = model.predict_proba(X_test)", "purpose": "輸出各類別預測後驗機率向量 (分類專用)"}, {"call": "model.score(X_test, y_test)", "purpose": "快速評估模型 (回歸輸出 R²，分類輸出 Accuracy)"}], "highlights": "所有估計器 (Estimator) 皆實作 fit 方法，轉換器 (Transformer) 實作 fit_transform 方法。管線化 (Pipeline) 是避免測試集資料外洩 (Data Leakage) 的最高工業實踐。", "codeSnippet": "from sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import Ridge\n\npipe = Pipeline([\n    ('scaler', StandardScaler()),\n    ('regressor', Ridge(alpha=1.0))\n])\npipe.fit(X_train, y_train)\nr2_score = pipe.score(X_test, y_test)", "url": "01.機器學習/01.監督式「分類」與非監督式「分群」.html"}, {"id": "fn_regression", "name": "迴歸分析 (Regression)", "x": 340, "y": 140, "r": 20, "color": "#22c55e", "stroke": "#bbf7d0", "textColor": "#ffffff", "category": "sklearn", "badge": "Continuous Prediction", "desc": "預測連續數值目標，包含普通最小平方法 (OLS) 與帶 L1/L2 正則化約束之線性模型。", "functions": [{"call": "LinearRegression(fit_intercept=True)", "purpose": "建立普通最小平方法回歸模型，求解封閉解析解"}, {"call": "Ridge(alpha=1.0, solver='auto')", "purpose": "L2 正則化回歸，懲罰過大權重，緩解共線性"}, {"call": "Lasso(alpha=0.1, max_iter=1000)", "purpose": "L1 正則化回歸，具備稀疏解特性，可進行自動特徵選擇"}, {"call": "ElasticNet(alpha=0.1, l1_ratio=0.5)", "purpose": "混合 L1 與 L2 懲罰項，兼顧特徵篩選與分組效應"}], "highlights": "正則化係數 alpha ($\\lambda$) 是控制偏差-方差權衡的核心參數。L1 (Lasso) 會將非重要特徵係數直接壓縮為 0，L2 (Ridge) 則僅縮小權重但不歸零。輸入特徵必須先經 StandardScaler 標準化！", "codeSnippet": "from sklearn.linear_model import Ridge, Lasso\n# 1. 建立 L2 Ridge 回歸並擬合\nridge = Ridge(alpha=10.0)\nridge.fit(X_train_scaled, y_train)\n\n# 2. 獲取學習到的權重與截距\nprint(\"權重係數 w:\", ridge.coef_)\nprint(\"截距偏置 b:\", ridge.intercept_)", "url": "01.機器學習/02.迴歸分析 (Regression) .html"}, {"id": "fn_classification", "name": "分類模型 (Classification)", "x": 340, "y": 240, "r": 20, "color": "#22c55e", "stroke": "#bbf7d0", "textColor": "#ffffff", "category": "sklearn", "badge": "Discrete Classification", "desc": "預測離散類別標籤，支援邏輯斯回歸、隨機森林、支持向量機 (SVM) 與 GBDT。", "functions": [{"call": "LogisticRegression(C=1.0, max_iter=200)", "purpose": "Sigmoid 映射二元/多元分類，C 為正則化強度倒數"}, {"call": "RandomForestClassifier(n_estimators=100, max_depth=None)", "purpose": "Bagging 隨機森林，集成多棵決策樹降低方差"}, {"call": "SVC(kernel='rbf', C=1.0, probability=True)", "purpose": "支援向量機，以核函數將特徵投射至高維空間最大化分類間隔"}, {"call": "GradientBoostingClassifier(learning_rate=0.1)", "purpose": "序列式 Boosting，每棵新樹擬合前序殘差"}], "highlights": "對於高維稀疏資料（文字），SVM 與邏輯斯回歸表現極佳；對於結構化表格資料，隨機森林與 GBDT (XGBoost/LightGBM) 是產業實務首選，抗離群值且免做單調特徵縮放。", "codeSnippet": "from sklearn.ensemble import RandomForestClassifier\nrf = RandomForestClassifier(n_estimators=200, max_depth=10, random_state=42)\nrf.fit(X_train, y_train)\n\n# 評估各特徵重要性 (Feature Importances)\nimportances = rf.feature_importances_\ntop_indices = np.argsort(importances)[::-1][:5]\nprint(\"前五大關鍵影響特徵索引:\", top_indices)", "url": "01.機器學習/01.監督式「分類」與非監督式「分群」.html"}, {"id": "fn_metrics", "name": "評估指標 (Metrics API)", "x": 160, "y": 140, "r": 18, "color": "#86efac", "stroke": "#16a34a", "textColor": "#14532d", "category": "sklearn", "badge": "Evaluation API", "desc": "精確量化分類與回歸模型效能，輸出混淆矩陣、ROC-AUC、F1 與均方誤差。", "functions": [{"call": "confusion_matrix(y_true, y_pred)", "purpose": "計算混淆矩陣 (TN, FP, FN, TP)"}, {"call": "classification_report(y_true, y_pred)", "purpose": "一鍵輸出 Precision, Recall, F1-Score 與 Support"}, {"call": "roc_auc_score(y_true, y_score)", "purpose": "計算 ROC 曲線下面積，評估各閾值下的整體排序能力"}, {"call": "mean_squared_error(y_true, y_pred, squared=False)", "purpose": "計算均方誤差 (MSE) 或根均方誤差 (RMSE)"}], "highlights": "在不平衡數據（如晶圓瑕疵、信用卡盜刷）中，切忌僅看 Accuracy！必須看 Recall（查全率，確保瑕疵漏檢最小）與 PR-AUC 曲線。", "codeSnippet": "from sklearn.metrics import classification_report, roc_auc_score\nprint(classification_report(y_test, y_pred, target_names=['良品', '不良品']))\nauc = roc_auc_score(y_test, y_prob[:, 1])\nprint(f\"ROC-AUC 得分: {auc:.4f}\")", "url": "01.機器學習/04.分類與回歸評估方法.html"}, {"id": "fn_validation", "name": "交叉驗證與抽樣 (Validation & Sampling)", "x": 160, "y": 240, "r": 18, "color": "#86efac", "stroke": "#16a34a", "textColor": "#14532d", "category": "sklearn", "badge": "Resampling & CV", "desc": "K-Fold 折交叉驗證防止過擬合，SMOTE 合成少數類樣本破解極度不平衡難題。", "functions": [{"call": "KFold(n_splits=5, shuffle=True, random_state=42)", "purpose": "將數據均勻切為 K 份輪流驗證"}, {"call": "StratifiedKFold(n_splits=5)", "purpose": "分層 K 折驗證，嚴格保持每折的類別比例一致"}, {"call": "SMOTE(k_neighbors=5, random_state=42)", "purpose": "在特徵空間透過 KNN 內插合成少數類虛擬樣本"}, {"call": "cross_val_score(model, X, y, cv=5, scoring='f1')", "purpose": "自動執行 K 折訓練並回傳各折評估得分陣列"}], "highlights": "【重要考點】：SMOTE 只能在訓練集 (Train Fold) 上執行，絕不能在包含測試集的全局數據上做 SMOTE，否則會造成致命的「資料外洩 (Data Leakage)」！", "codeSnippet": "from imblearn.over_sampling import SMOTE\nfrom sklearn.model_selection import StratifiedKFold\n\n# 僅對訓練集進行少數類合成擴充\nsm = SMOTE(k_neighbors=5, random_state=42)\nX_train_res, y_train_res = sm.fit_resample(X_train, y_train)\nprint(f\"SMOTE 後訓練樣本平衡分佈: {np.bincount(y_train_res)}\")", "url": "01.機器學習/06.smote.html"}, {"id": "fn_clustering", "name": "分群聚類 (Clustering)", "x": 340, "y": 350, "r": 20, "color": "#22c55e", "stroke": "#bbf7d0", "textColor": "#ffffff", "category": "sklearn", "badge": "Unsupervised Grouping", "desc": "無標籤自主分群，涵蓋 K-Means 質心聚類、DBSCAN 密度聚類與高斯混合模型 GMM。", "functions": [{"call": "KMeans(n_clusters=3, init='k-means++', n_init=10)", "purpose": "劃分 K 個球狀群集，最小化群內平方和 (Inertia)"}, {"call": "DBSCAN(eps=0.5, min_samples=5)", "purpose": "基於密度半徑向外連通，標記 -1 為離群噪聲點"}, {"call": "GaussianMixture(n_components=3, covariance_type='full')", "purpose": "高斯混合軟分群，EM 演算法估計機率隸屬度"}, {"call": "silhouette_score(X, labels)", "purpose": "計算輪廓係數 (-1~1)，衡量群內緊密度與群間分離度"}], "highlights": "K-Means 對非凸形狀（如同心圓）與離群值無能為力；DBSCAN 能發現任意形狀且抗噪，但不需預設 K 值；GMM 能處理橢圓長條分佈並給出樣本屬於各群的機率值。", "codeSnippet": "from sklearn.cluster import KMeans\nfrom sklearn.metrics import silhouette_score\n\nkmeans = KMeans(n_clusters=4, init='k-means++', random_state=42)\nlabels = kmeans.fit_predict(X_scaled)\nscore = silhouette_score(X_scaled, labels)\nprint(f\"K-Means 輪廓係數: {score:.4f}, 群中心座標:\\n{kmeans.cluster_centers_}\")", "url": "01.機器學習/01.監督式「分類」與非監督式「分群」.html"}, {"id": "fn_dim_reduction", "name": "降維與特徵萃取 (Dimension Reduction)", "x": 340, "y": 460, "r": 20, "color": "#22c55e", "stroke": "#bbf7d0", "textColor": "#ffffff", "category": "sklearn", "badge": "Feature Projection", "desc": "解除高維共線性與視覺化，涵蓋非監督 PCA、監督式 LDA 與非線性 t-SNE / UMAP。", "functions": [{"call": "PCA(n_components=2)", "purpose": "協方差矩陣特徵分解，沿方差最大化正交投影"}, {"call": "LinearDiscriminantAnalysis(n_components=1)", "purpose": "最大化類間散度比，監督式線性判別降維"}, {"call": "TSNE(n_components=2, perplexity=30.0)", "purpose": "以 Student-t 分佈保留局部流形鄰域，二維視覺化首選"}, {"call": "pca.explained_variance_ratio_", "purpose": "獲取各主成分解釋的方差比率累計"}], "highlights": "PCA 適合去除噪聲與線性特徵壓縮；LDA 最多只能降到 $C-1$ 維（$C$ 為類別數）；t-SNE 只能用於視覺化探索，無法直接用 `transform()` 轉換新進入的測試樣本！", "codeSnippet": "from sklearn.decomposition import PCA\npca = PCA(n_components=0.95) # 保留 95% 總方差資訊\nX_reduced = pca.fit_transform(X_train_scaled)\nprint(f\"維度由 {X_train.shape[1]} 維成功降至 {X_reduced.shape[1]} 維\")\nprint(\"各主成分貢獻率:\", pca.explained_variance_ratio_)", "url": "01.機器學習/07.降維_pca_vs_lda_vs_t_sne.html"}, {"id": "dl_group", "name": "PyTorch 深度學習骨幹", "x": 750, "y": 280, "r": 26, "color": "#2563eb", "stroke": "#93c5fd", "textColor": "#ffffff", "category": "pytorch", "badge": "Deep Learning Engine", "desc": "基於動態計算圖 (Dynamic Computation Graph / Autograd) 的神經網路設計與張量運算體系。", "functions": [{"call": "torch.tensor(data, requires_grad=True)", "purpose": "建立具備自動求導追蹤的基礎張量"}, {"call": "torch.nn.Module", "purpose": "所有神經網路層與模型的抽象基類"}, {"call": "torch.optim.AdamW(model.parameters(), lr=1e-3)", "purpose": "帶權重衰減解耦的現代自適應梯度優化器"}, {"call": "torch.cuda.is_available()", "purpose": "檢測 GPU 硬體加速就緒狀態"}], "highlights": "PyTorch 核心工作流是「前向計算 `y_pred = model(x)` $\\to$ 損失計算 `loss = criterion(y_pred, y)` $\\to$ 梯度清零 `optimizer.zero_grad()` $\\to$ 反向求導 `loss.backward()` $\\to$ 權重迭代 `optimizer.step()`」。", "codeSnippet": "import torch\nimport torch.nn as nn\n\nclass MLP(nn.Module):\n    def __init__(self, in_features, hidden, num_classes):\n        super().__init__()\n        self.net = nn.Sequential(\n            nn.Linear(in_features, hidden),\n            nn.BatchNorm1d(hidden),\n            nn.ReLU(),\n            nn.Linear(hidden, num_classes)\n        )\n    def forward(self, x):\n        return self.net(x)", "url": "02.深度學習/0203.VGG16 深度學習互動全解析.html"}, {"id": "fn_cnn_vgg", "name": "卷積網路與 VGG16 (CNN)", "x": 600, "y": 140, "r": 20, "color": "#3b82f6", "stroke": "#bfdbfe", "textColor": "#ffffff", "category": "pytorch", "badge": "Computer Vision", "desc": "連續堆疊 3x3 小卷積核取代大卷積核，具備感受野等價性與更強非線性表徵能力。", "functions": [{"call": "nn.Conv2d(in_channels, out_channels, kernel_size=3, padding=1)", "purpose": "二維卷積層，提取圖像空間局部特徵"}, {"call": "nn.MaxPool2d(kernel_size=2, stride=2)", "purpose": "最大池化層，尺寸減半，賦予微幅平移不變性"}, {"call": "models.vgg16(weights=VGG16_Weights.DEFAULT)", "purpose": "載入 ImageNet 預訓練權重，遷移學習起點"}, {"call": "model.features; model.classifier", "purpose": "分別存取卷積特徵提取段與全連接分類頭段"}], "highlights": "兩個 3x3 卷積串聯等價於 5x5 感受野，三個 3x3 等價於 7x7 感受野，但參數少 45% 且多了 3 次非線性激活 (ReLU)！缺點是 FC 層參數量達 138M，現代主流被 GAP (全局平均池化) 取代。", "codeSnippet": "import torchvision.models as models\n# 載入預訓練 VGG16 並凍結特徵提取層進行微調 (Fine-tuning)\nvgg = models.vgg16(pretrained=True)\nfor param in vgg.features.parameters():\n    param.requires_grad = False\n\n# 替換最後一層輸出為自訂 2 類瑕疵分類\nvgg.classifier[6] = nn.Linear(4096, 2)", "url": "02.深度學習/0203.VGG16 深度學習互動全解析.html"}, {"id": "fn_loss_engine", "name": "損失函數與梯度流 (Loss Functions)", "x": 750, "y": 140, "r": 20, "color": "#3b82f6", "stroke": "#bfdbfe", "textColor": "#ffffff", "category": "pytorch", "badge": "Optimization Drivers", "desc": "反向傳播的靈魂方向盤，解析交叉熵、MSE 與自迴歸語言模型損失計算。", "functions": [{"call": "nn.CrossEntropyLoss()", "purpose": "多元分類標準損失，內部自帶 LogSoftmax + NLLLoss"}, {"call": "nn.BCEWithLogitsLoss()", "purpose": "二元分類數值穩定版，內建 Sigmoid 避免溢位"}, {"call": "nn.MSELoss()", "purpose": "均方誤差，連續值迴歸與自編碼器像素重構損失"}, {"call": "loss.backward()", "purpose": "執行反向傳播，沿計算圖根據鏈鎖律回傳各層參數梯度"}], "highlights": "【重要陷阱】：使用 `nn.CrossEntropyLoss()` 時，網路最後一層輸出必須是未經過 Softmax 的原始分數 (Logits)！若手動加了 `nn.Softmax()` 再輸入，會導致重複 Softmax，梯度急遽萎縮！", "codeSnippet": "criterion = nn.CrossEntropyLoss()\noptimizer = optim.AdamW(model.parameters(), lr=1e-3)\n\nfor epoch in range(epochs):\n    optimizer.zero_grad()      # 1. 清空前一輪殘留梯度\n    outputs = model(inputs)    # 2. 前向推論獲得 Logits\n    loss = criterion(outputs, targets) # 3. 計算交叉熵損失\n    loss.backward()            # 4. 反向求導各層 grad\n    optimizer.step()           # 5. 根據梯度更新權重", "url": "04.補充教材/03.為什麼做分類訓練不能用 MSE？.html"}, {"id": "gen_group", "name": "生成式 AI 與大模型", "x": 980, "y": 320, "r": 26, "color": "#7c3aed", "stroke": "#c4b5fd", "textColor": "#ffffff", "category": "genai", "badge": "Generative Foundation", "desc": "從潛在分佈採樣創造全新內容，涵蓋 Autoencoder, VAE, Stable Diffusion, GAN 與 RLHF 對齊。", "functions": [{"call": "AutoencoderKL.from_pretrained()", "purpose": "載入預訓練變分自編碼器，壓縮影像至低維潛在空間"}, {"call": "UNet2DConditionModel.from_pretrained()", "purpose": "時間步與文字條件控制之雜訊預測主幹神經網路"}, {"call": "DPMSolverMultistepScheduler", "purpose": "高階常微分 (ODE) 求解器，20~30 步快速採樣去噪"}, {"call": "AutoModelForCausalLM.generate()", "purpose": "大語言模型自迴歸滾動續寫 Token 生成"}], "highlights": "生成模型的本質是學習高維複雜數據機率分佈 $P(X)$。GAN 透過對抗博弈；VAE 透過顯式變分下界 (ELBO)；Diffusion 透過前向加噪與反向評分匹配 (Score Matching) 逐步去噪，兼顧極致質量與多樣性。", "codeSnippet": "from diffusers import StableDiffusionPipeline\nimport torch\n\npipe = StableDiffusionPipeline.from_pretrained(\n    \"runwayml/stable-diffusion-v1-5\", \n    torch_dtype=torch.float16\n).to(\"cuda\")\n\n# 透過文字 Prompt 與 CFG scale 生成影像\nprompt = \"high-tech semiconductor wafer cleanroom with robotic arms, 8k\"\nimage = pipe(prompt, guidance_scale=7.5, num_inference_steps=25).images[0]", "url": "07.比較/GAN vs VAE vs Diffusion.html"}, {"id": "fn_ae_vae", "name": "自編碼器 (AE vs VAE)", "x": 1150, "y": 140, "r": 20, "color": "#8b5cf6", "stroke": "#ddd6fe", "textColor": "#ffffff", "category": "genai", "badge": "Latent Manifold", "desc": "資訊瓶頸降維與連續潛在空間建模，重參數化技巧解決隨機節點不可導問題。", "functions": [{"call": "encode(x) -> mu, logvar", "purpose": "編碼器輸出潛在空間之高斯均值向量與對數方差向量"}, {"call": "reparameterize(mu, logvar)", "purpose": "z = mu + std * eps (eps ~ N(0, I))，維持計算圖連續可導"}, {"call": "decode(z) -> x_reconstructed", "purpose": "解碼器自潛在向量重構高維像素訊號"}, {"call": "kl_divergence_loss", "purpose": "約束潛在分佈貼近標準常態分佈 N(0, I)，確保空間平滑連續"}], "highlights": "傳統 AE 潛在空間充滿空洞與孤立點，隨機給定向量解碼往往產出怪物；VAE 透過 KL 散度強迫均值聚攏、方差貼近 1，形成平滑可插值的潛在分佈，成為現代擴散模型 (LDM) 的壓縮底座！", "codeSnippet": "def reparameterize(mu, logvar):\n    std = torch.exp(0.5 * logvar)\n    eps = torch.randn_like(std) # 自標準常態分佈隨機抽樣\n    return mu + eps * std      # 重參數化：將隨機性移至無權重分支\n\n# VAE 損失 = 重建誤差 + 潛在空間正則化 (KL 散度)\nrecon_loss = nn.functional.mse_loss(recon_x, x, reduction='sum')\nkl_loss = -0.5 * torch.sum(1 + logvar - mu.pow(2) - logvar.exp())\ntotal_loss = recon_loss + kl_loss", "url": "02.深度學習/0204.Autoencoder (AE, 自編碼器) 與 VAE (Variational Autoencoder, 變分自編碼器).html"}, {"id": "fn_stable_diffusion", "name": "潛在擴散模型 (Stable Diffusion)", "x": 1280, "y": 240, "r": 20, "color": "#8b5cf6", "stroke": "#ddd6fe", "textColor": "#ffffff", "category": "genai", "badge": "LDM / Diffusion", "desc": "在 VAE 壓縮的低維空間以 Cross-Attention 條件引導 UNet 逆向去噪生成高解析影像。", "functions": [{"call": "clip_text_encoder(prompt_tokens)", "purpose": "將文字提示詞編碼為語意條件向量 Embedding"}, {"call": "unet(noisy_latent, t, encoder_hidden_states)", "purpose": "預測特定時間步 t 混入的雜訊分量 eps_theta"}, {"call": "scheduler.step(model_output, t, sample)", "purpose": "依據常微分去噪方程式，計算前一個時間步的淨化潛在向量"}, {"call": "vae.decode(latents / 0.18215)", "purpose": "一次性將乾淨潛在特徵還原為高畫質 RGB 影像"}], "highlights": "低維潛在空間運算將計算量銳減 64 倍（$512\\times512\\times3 \\to 64\\times64\\times4$）；Classifier-Free Guidance (CFG) 透過雙向權衡：$\\tilde{\\epsilon} = \\epsilon_u + s \\cdot (\\epsilon_c - \\epsilon_u)$，讓生成嚴格貼合提示詞指令。", "codeSnippet": "# 核心去噪迴圈 (Denoising Loop 偽代碼)\nlatents = torch.randn(batch_size, 4, 64, 64).to(device) # 純高斯噪聲\nfor t in scheduler.timesteps:\n    # 預測噪聲\n    noise_pred = unet(latents, t, encoder_hidden_states=text_embeddings).sample\n    # 執行無分類器引導 (CFG)\n    noise_pred = noise_pred_uncond + guidance_scale * (noise_pred_text - noise_pred_uncond)\n    # 反向更新時間步\n    latents = scheduler.step(noise_pred, t, latents).prev_sample", "url": "02.深度學習/0201.stable_diffusion(潛在擴散模型).html"}, {"id": "fn_rlhf_ppo", "name": "大模型對齊與 RLHF (PPO / DPO)", "x": 1280, "y": 350, "r": 20, "color": "#8b5cf6", "stroke": "#ddd6fe", "textColor": "#ffffff", "category": "genai", "badge": "Model Alignment", "desc": "基於人類回饋的強化學習，透過獎勵模型 (Reward Model) 與 PPO 策略梯度對齊價值觀。", "functions": [{"call": "reward_model(prompt + response)", "purpose": "以 Bradley-Terry 偏好排序訓練之標量獎勵評分模型"}, {"call": "PPOTrainer.step(queries, responses, scores)", "purpose": "近端策略最佳化，透過裁剪重要性權重防止策略崩潰"}, {"call": "torch.distributions.Categorical(logits)", "purpose": "建構動作機率分佈以計算 Log-prob 與策略熵"}, {"call": "kl_penalty = beta * (log_p - log_ref)", "purpose": "加入 KL 懲罰項，防範獎勵作弊 (Reward Hacking)"}], "highlights": "RLHF 四大巨頭模型：Actor (當前策略), Critic (價值基線), Reference (凍結原版防漂移), Reward (人類打分器)。現代免獎勵模型替代方案為 DPO (Direct Preference Optimization)，直接在閉環中以隱式解析解更新。", "codeSnippet": "# PPO 核心目標函數裁剪項\nratio = torch.exp(new_logprobs - old_logprobs)\nsurr1 = ratio * advantages\nsurr2 = torch.clamp(ratio, 1.0 - clip_eps, 1.0 + clip_eps) * advantages\npolicy_loss = -torch.min(surr1, surr2).mean()\n\n# 總損失包含價值損失與 KL 散度保護\nloss = policy_loss + 0.5 * value_loss + kl_penalty", "url": "01.機器學習/4.強化學習/0401.RLHF（基於人類回饋的強化學習，Reinforcement Learning from Human Feedback）.html"}, {"id": "sim_group", "name": "機率模擬與 MCMC", "x": 680, "y": 680, "r": 26, "color": "#ea580c", "stroke": "#fdba74", "textColor": "#ffffff", "category": "sim", "badge": "Probabilistic Engines", "desc": "大數法則蒙地卡羅隨機推演、馬可夫轉移鏈與貝葉斯高維抽樣 MCMC (Metropolis-Hastings, Gibbs)。", "functions": [{"call": "np.random.uniform(low, high, size)", "purpose": "連續均勻分佈隨機數生成，蒙地卡羅幾何求積基石"}, {"call": "P.dot(state_distribution)", "purpose": "馬可夫鏈狀態轉移機率矩陣相乘，求取下一步狀態分佈"}, {"call": "np.linalg.eig(P.T)", "purpose": "特徵值分解求取最大特徵值 1 對應之左特徵向量 (平穩分佈)"}, {"call": "alpha = min(1, (p_star * q_rev) / (p_cur * q_fwd))", "purpose": "Metropolis-Hastings 接受率計算，細緻平衡條件保證"}], "highlights": "蒙地卡羅利用大數法則突破維度詛咒（誤差收斂恆為 $O(1/\\sqrt{N})$）；馬可夫鏈描述狀態轉移；當兩者結合為 MCMC 時，能徹底破解貝葉斯後驗分母無法解析積分的天文難題！", "codeSnippet": "# Metropolis-Hastings (MH) 採樣核心迴圈\nx_cur = 0.0\nsamples = []\nfor _ in range(10000):\n    x_cand = np.random.normal(x_cur, 0.5) # 提議分佈\n    alpha = min(1.0, target_dist(x_cand) / target_dist(x_cur)) # 接受率\n    if np.random.rand() < alpha:\n        x_cur = x_cand # 接受跳轉\n    samples.append(x_cur)", "url": "04.補充教材/09.馬可夫鏈蒙地卡羅(MCMC).html"}, {"id": "fn_monte_carlo", "name": "蒙地卡羅數值積分 (Monte Carlo)", "x": 520, "y": 800, "r": 20, "color": "#f97316", "stroke": "#fed7aa", "textColor": "#ffffff", "category": "sim", "badge": "Stochastic Sampling", "desc": "隨機投點求面積、金融衍生品定價與 AlphaGo 蒙地卡羅樹搜尋 (MCTS)。", "functions": [{"call": "np.random.rand(N, 2)", "purpose": "在單位正方形內均勻生成 N 個隨機點"}, {"call": "inside = (x**2 + y**2) <= 1.0", "purpose": "幾何指示函數條件過濾判定"}, {"call": "pi_est = 4.0 * np.sum(inside) / N", "purpose": "以落入圓形比例乘上正方形面積求得 Pi 近似值"}, {"call": "scipy.stats.qmc.Sobol(d)", "purpose": "擬隨機序列 (Quasi-Monte Carlo) 低差異抽樣加速收斂"}], "highlights": "標準隨機抽樣存在群聚聚集現象，使用 Sobol 擬隨機序列或重要性採樣 (Importance Sampling) 能使方差大幅縮減數十倍，顯著加速數值收斂速度。", "codeSnippet": "import numpy as np\nN = 1_000_000\npts = np.random.uniform(-1, 1, (N, 2))\ninside = np.sum(pts**2, axis=1) <= 1.0\npi_estimate = 4.0 * np.sum(inside) / N\nprint(f\"百萬次蒙地卡羅估算 Pi: {pi_estimate:.6f}\")", "url": "04.補充教材/06.蒙地卡羅方法 (Monte Carlo Methods).html"}, {"id": "fn_markov_chain", "name": "馬可夫鏈與平穩分佈 (Markov Chain)", "x": 780, "y": 800, "r": 20, "color": "#f97316", "stroke": "#fed7aa", "textColor": "#ffffff", "category": "sim", "badge": "Dynamic State Transition", "desc": "無記憶性隨機過程、Chapman-Kolmogorov 方程矩陣次方與 Google PageRank。", "functions": [{"call": "P = np.array([[0.9, 0.1], [0.5, 0.5]])", "purpose": "定義行隨機轉移機率矩陣 (每列和恆為 1)"}, {"call": "np.linalg.matrix_power(P, 50)", "purpose": "矩陣多次方快速求解長期轉移收斂矩陣"}, {"call": "scipy.linalg.null_space(P.T - np.eye(n))", "purpose": "求解零空間，取得穩態平穩分佈向量 pi * P = pi"}, {"call": "hmm.MultinomialHMM(n_components=3)", "purpose": "隱馬可夫模型，用於語音解碼與時序推論"}], "highlights": "若馬可夫鏈滿足不可約（任何狀態可互達）與非週期性，則無論初始狀態分佈為何，經過足夠步數後必收斂至唯一平穩分佈 $\\pi$！工業上常用於機台劣化預知保養 (PdM)。", "codeSnippet": "# 設備健康四態馬可夫轉移模擬\nimport numpy as np\nP = np.array([\n    [0.90, 0.07, 0.02, 0.01], # 良好\n    [0.00, 0.85, 0.10, 0.05], # 輕微磨損\n    [0.00, 0.00, 0.70, 0.30], # 嚴重劣化\n    [0.00, 0.00, 0.00, 1.00]  # 停機故障\n])\nstate = np.array([1.0, 0.0, 0.0, 0.0]) # 初始全新品\nfor step in range(30):\n    state = state.dot(P)\nprint(f\"30 天後設備停機故障機率: {state[3]*100:.2f}%\")", "url": "04.補充教材/07.馬可夫鏈.html"}, {"id": "agent_group", "name": "自主智慧體與電腦視覺", "x": 1050, "y": 680, "r": 26, "color": "#0d9488", "stroke": "#5eead4", "textColor": "#ffffff", "category": "agent", "badge": "Autonomous & Perception", "desc": "自主網頁操控智慧體 (Playwright / Tool Use) 與工業級極速物件偵測 (Ultralytics YOLO)。", "functions": [{"call": "sync_playwright().start()", "purpose": "啟動無頭/有頭瀏覽器自動化感知與操作環境"}, {"call": "page.locator(selector).click()", "purpose": "以語意選擇器或座標定位元素並觸發點擊操作"}, {"call": "YOLO('yolov8n.pt')", "purpose": "載入輕量化 YOLO 奈米模型，邊緣端超高速推論 (100+ FPS)"}, {"call": "model.predict(source, conf=0.5, iou=0.7)", "purpose": "端到端輸出邊界框座標、置信度與多標籤類別"}], "highlights": "Web Agent 透過「截圖感知 $\\to$ 座標定位 (Set-of-Marks) $\\to$ 動作發派 $\\to$ 畫面比對驗證」閉環運作；YOLO 將物件偵測重塑為單一回歸問題，實時定位邊界框與類別概率。", "codeSnippet": "from ultralytics import YOLO\n# 載入 YOLO 模型進行晶圓瑕疵定位\nmodel = YOLO('yolov8n.pt')\nresults = model('wafer_sample.jpg', conf=0.4)\n\nfor r in results:\n    for box in r.boxes:\n        cls_id = int(box.cls[0])\n        conf = float(box.conf[0])\n        coords = box.xyxy[0].tolist()\n        print(f\"檢測到類別 {model.names[cls_id]}, 置信度 {conf:.2f}, 邊界框: {coords}\")", "url": "04.補充教材/10.YOLO 與 Google Teachable Machine 是否屬於「機器學習分類」.html"}, {"id": "fn_web_agent", "name": "網頁感知與操作 Agent (Playwright)", "x": 980, "y": 820, "r": 20, "color": "#14b8a6", "stroke": "#99f6e4", "textColor": "#ffffff", "category": "agent", "badge": "Web Automation", "desc": "大模型與 Playwright / MCP 閉環整合，實現自動巡檢、表單填寫與動態截圖爬取。", "functions": [{"call": "browser.new_page(viewport={'width': 1280, 'height': 800})", "purpose": "開闢獨立頁面視窗工作階段"}, {"call": "page.goto(url, wait_until='networkidle')", "purpose": "導航至目標 URL 並等待非同步請求完畢"}, {"call": "page.screenshot(path='view.png', full_page=True)", "purpose": "截取全頁高畫質畫面供多模態模型 (VLM) 視覺理解"}, {"call": "page.evaluate('() => document.title')", "purpose": "在瀏覽器上下文中注入並執行自訂 JavaScript 腳本"}], "highlights": "Playwright 支援自動等待 (Auto-waiting)，在元素可點擊前不會盲目點擊；結合 Accessibility Tree 提取無障礙樹，比直接丟純 HTML 給 LLM 節省 80% Token 並避免佈局錯位！", "codeSnippet": "from playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True)\n    page = browser.new_page()\n    page.goto('https://example.com')\n    page.fill('input[name=\"query\"]', 'iPAS AI 證照')\n    page.keyboard.press('Enter')\n    page.wait_for_selector('.search-results')\n    page.screenshot(path='results.png')\n    browser.close()", "url": "05.讀學時光 Rido(Read) & Learn/02.AI 是如何「感知」並「操作」網頁的.html"}, {"id": "fn_yolo_vision", "name": "YOLO 物件偵測管線 (Object Detection)", "x": 1200, "y": 820, "r": 20, "color": "#14b8a6", "stroke": "#99f6e4", "textColor": "#ffffff", "category": "agent", "badge": "Real-time Detection", "desc": "單次前向傳播同時回歸 Bounding Box 座標與類別機率，支援晶圓/PCB 瑕疵即時偵測。", "functions": [{"call": "model.train(data='custom.yaml', epochs=100, imgsz=640)", "purpose": "在標註數據集上進行端到端遷移學習微調"}, {"call": "model.export(format='onnx', dynamic=True)", "purpose": "將 PyTorch 權重導出為 ONNX/TensorRT，邊緣端硬體加速"}, {"call": "box.xywh; box.xyxy", "purpose": "分別輸出中心寬高或左上右下像素座標格式"}, {"call": "Non-Maximum Suppression (NMS)", "purpose": "非極大值抑制，依據 IoU 閾值過濾重疊冗餘預測框"}], "highlights": "YOLO 的損失函數是複合式的：$\\mathcal{L} = \\lambda_{coord} \\mathcal{L}_{CIoU} + \\lambda_{conf} \\mathcal{L}_{BCE} + \\lambda_{cls} \\mathcal{L}_{BCE}$。它包含邊界框迴歸、目標存在置信度二分類與多類別分類！", "codeSnippet": "from ultralytics import YOLO\n\n# 載入自訂訓練之半導體瑕疵檢測模型\nmodel = YOLO('best_defect_model.pt')\n\n# 執行批次推論並回傳帶標註視覺化影像\nresults = model(['wafer_01.jpg', 'wafer_02.jpg'], conf=0.5, iou=0.45)\nfor i, res in enumerate(results):\n    res.save(filename=f'annotated_wafer_{i}.jpg') # 輸出標註結果圖", "url": "04.補充教材/10.YOLO 與 Google Teachable Machine 是否屬於「機器學習分類」.html"}];

    function renderSvg() {
      const rootG = document.getElementById('rootG');

      // 1. 繪製五大分類背景卡片
      const bgG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      bgG.innerHTML = `
        <!-- Scikit-Learn 機器學習區塊 -->
        <rect x="40" y="80" width="460" height="460" rx="24" fill="#064e3b" fill-opacity="0.18" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,4"/>

        <!-- PyTorch 深度學習區塊 -->
        <rect x="520" y="80" width="370" height="340" rx="24" fill="#1e3a8a" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="540" y="115" fill="#60a5fa" font-size="14" font-weight="800">🔵 PyTorch 深度學習骨幹</text>

        <!-- 生成式 AI 與大模型區塊 -->
        <rect x="910" y="80" width="570" height="460" rx="24" fill="#581c87" fill-opacity="0.18" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="930" y="115" fill="#c084fc" font-size="14" font-weight="800">🟣 生成式 AI 與大模型 (Diffusers / Transformers)</text>

        <!-- 機率模擬與 MCMC 區塊 -->
        <rect x="430" y="600" width="480" height="340" rx="24" fill="#7c2d12" fill-opacity="0.18" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="450" y="635" fill="#fb923c" font-size="14" font-weight="800">🟠 機率模擬與 MCMC 統計推論</text>

        <!-- 自主智慧體與視覺區塊 -->
        <rect x="930" y="600" width="550" height="340" rx="24" fill="#134e4a" fill-opacity="0.18" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="950" y="635" fill="#2dd4bf" font-size="14" font-weight="800">🔴 自主智慧體 (Playwright) 與邊緣視覺 (YOLO)</text>
      `;
      rootG.appendChild(bgG);

      // 2. 繪製連線
      const linksG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const nodeMap = {};
      NODES.forEach(n => { nodeMap[n.id] = n; });

      LINKS.forEach(l => {
        const src = nodeMap[l.from];
        const dst = nodeMap[l.to];
        if (src && dst) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', src.x);
          line.setAttribute('y1', src.y);
          line.setAttribute('x2', dst.x);
          line.setAttribute('y2', dst.y);
          line.setAttribute('stroke', '#475569');
          line.setAttribute('stroke-width', '1.8');
          line.setAttribute('stroke-dasharray', '5,5');
          line.setAttribute('data-category', l.category);
          line.id = `link_${l.from}_${l.to}`;
          linksG.appendChild(line);
        }
      });
      rootG.appendChild(linksG);

      // 3. 繪製節點
      const nodesG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      NODES.forEach(n => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'mindmap-node');
        g.setAttribute('id', `node_${n.id}`);
        g.setAttribute('data-category', n.category);
        g.onclick = (e) => {
          e.stopPropagation();
          selectNode(n.id);
        };

        // 圓球
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', n.x);
        circle.setAttribute('cy', n.y);
        circle.setAttribute('r', n.r);
        circle.setAttribute('fill', n.color);
        circle.setAttribute('stroke', n.stroke || '#ffffff');
        circle.setAttribute('stroke-width', '2.5');
        circle.setAttribute('filter', 'url(#nodeShadow)');
        g.appendChild(circle);

        // 文字
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', n.x);
        text.setAttribute('y', n.r >= 26 ? n.y + 4.5 : n.y + 4);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', n.textColor || '#ffffff');
        text.setAttribute('font-size', n.r >= 26 ? '12.5' : (n.r >= 20 ? '10' : '9'));
        text.setAttribute('font-weight', '700');
        text.textContent = n.name;
        g.appendChild(text);

        nodesG.appendChild(g);
      });
      rootG.appendChild(nodesG);

      updateTransform();
    }

    // 平移與縮放操作
    function setupPanZoom() {
      const viewport = document.getElementById('viewport');

      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('#detailDrawer') || e.target.closest('.floating-toolbar')) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.12 : 0.88;
        zoom(factor);
      });
    }

    function zoom(factor) {
      const newScale = currentScale * factor;
      if (newScale >= 0.4 && newScale <= 3.0) {
        currentScale = newScale;
        updateTransform();
      }
    }

    function resetZoom() {
      currentScale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function updateTransform() {
      const rootG = document.getElementById('rootG');
      rootG.setAttribute('transform', `translate(${translateX}, ${translateY}) scale(${currentScale})`);
    }

    // 分類篩選
    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      NODES.forEach(n => {
        const el = document.getElementById(`node_${n.id}`);
        if (!el) return;
        if (cat === 'all' || n.category === cat || n.category === 'core') {
          el.style.opacity = '1';
          el.style.pointerEvents = 'auto';
        } else {
          el.style.opacity = '0.15';
          el.style.pointerEvents = 'none';
        }
      });

      LINKS.forEach(l => {
        const el = document.getElementById(`link_${l.from}_${l.to}`);
        if (!el) return;
        if (cat === 'all' || l.category === cat) {
          el.style.opacity = '1';
        } else {
          el.style.opacity = '0.08';
        }
      });
    }

    // 搜尋功能
    function setupSearch() {
      const input = document.getElementById('searchInput');
      input.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (!query) {
          filterCategory(currentCategory);
          return;
        }

        NODES.forEach(n => {
          const el = document.getElementById(`node_${n.id}`);
          if (!el) return;
          const matchName = n.name.toLowerCase().includes(query);
          const matchDesc = n.desc.toLowerCase().includes(query);
          const matchFn = n.functions && n.functions.some(f => f.call.toLowerCase().includes(query) || f.purpose.toLowerCase().includes(query));
          
          if (matchName || matchDesc || matchFn) {
            el.style.opacity = '1';
            el.classList.add('active-selected');
          } else {
            el.style.opacity = '0.1';
            el.classList.remove('active-selected');
          }
        });
      });
    }

    // 選擇節點並展開詳解抽屜
    function selectNode(nodeId) {
      activeNodeId = nodeId;
      const node = NODES.find(n => n.id === nodeId);
      if (!node) return;

      // 高亮當前節點
      document.querySelectorAll('.mindmap-node').forEach(el => el.classList.remove('active-selected'));
      const activeEl = document.getElementById(`node_${nodeId}`);
      if (activeEl) activeEl.classList.add('active-selected');

      // 填入抽屜資料
      document.getElementById('drawerTitle').textContent = node.name;
      document.getElementById('drawerBadge').textContent = node.badge || '核心技術';
      document.getElementById('drawerDesc').textContent = node.desc || '';

      // 函式清單
      const fnContainer = document.getElementById('drawerFunctions');
      fnContainer.innerHTML = '';
      if (node.functions && node.functions.length > 0) {
        node.functions.forEach(f => {
          const card = document.createElement('div');
          card.className = 'p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-xs space-y-1';
          card.innerHTML = `
            <div class="font-mono font-bold text-sky-400 flex items-center gap-1.5">
              <i class="fa-solid fa-cube text-slate-500 text-2xs"></i>
              <code>${f.call}</code>
            </div>
            <div class="text-slate-400 text-2xs">${f.purpose}</div>
          `;
          fnContainer.appendChild(card);
        });
      } else {
        fnContainer.innerHTML = '<div class="text-2xs text-slate-500">無特定函式清單</div>';
      }

      // 重點解析
      document.getElementById('drawerHighlights').innerHTML = node.highlights || '暫無架構重點';

      // 程式碼
      document.getElementById('drawerCode').textContent = node.codeSnippet || '# 暫無示範程式碼';

      // 專題頁面跳轉連結
      const linkBtn = document.getElementById('drawerLinkBtn');
      if (node.url) {
        linkBtn.href = node.url;
        linkBtn.classList.remove('hidden');
      } else {
        linkBtn.classList.add('hidden');
      }

      // 開啟抽屜
      document.getElementById('detailDrawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('detailDrawer').classList.remove('open');
      document.querySelectorAll('.mindmap-node').forEach(el => el.classList.remove('active-selected'));
    }

    // 複製代碼
    function copyCode() {
      const code = document.getElementById('drawerCode').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.textContent = '已複製！';
        setTimeout(() => { btnText.textContent = '複製代碼'; }, 2000);
      });
    }

    // 全螢幕切換
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // 視窗載入即啟動
    window.addEventListener('DOMContentLoaded', initMindmap);
  </script>
</body>
</html>
